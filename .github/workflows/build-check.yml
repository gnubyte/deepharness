name: Build check (temporary)

# Builds the DMG the way release.yml does (macos-15, its default Xcode) for the
# unreleased versions on this pull request, without publishing anything:
# 0.12.0 (main), 0.13.0 (the fleet-and-bedrock fixes) and the pull request's head.
# Removed again before the pull request is merged.

on:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: "0.12.0"
            ref: cb27049bc34cc9879266f907a5e7f1fc2ede3b26
          - version: "0.13.0"
            ref: 55dc91e4bb66bbbc46015fd3d6ccdbd88585cc12
          - version: "0.14.0"
            ref: ${{ github.event.pull_request.head.sha }}
    name: build ${{ matrix.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          fetch-depth: 0

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build the app bundle + DMG
        run: bash bundle.sh release
