name: Release DMG

# Publish the distributable .dmg to the GitHub Releases section.
#
# The version is read from the app bundle's Info.plist (CFBundleShortVersionString),
# so it stays in lockstep with bundle.sh. Tag a commit as v<version> (e.g. v0.4.0)
# and push it — the matching release is created (or re-created on re-tag) automatically.
#
#   1. Bump CFBundleShortVersionString in bundle.sh and the tag.
#   2. git tag v0.4.0 && git push origin v0.4.0
#   3. This workflow builds the DMG and publishes the release.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Swift toolchain
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '5.10'

      - name: Build the app bundle + DMG
        run: bash bundle.sh release

      - name: Read version from Info.plist
        id: meta
        run: |
          set -euo pipefail
          SHORT="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' build/DSH.app/Contents/Info.plist)"
          # Pad a short version ("0.4") up to a full one ("0.4.0").
          read -r major minor patch <<<"$(awk -F. '{while(NF<3)$0=$0".0"; print $1"."$2"."$3}' <<<"$SHORT")"
          FULL="$major.$minor.$patch"
          echo "full=$FULL" >> "$GITHUB_OUTPUT"
          echo "tag=v$FULL"   >> "$GITHUB_OUTPUT"
          echo "title=DSH Mac v$FULL" >> "$GITHUB_OUTPUT"

      - name: Keep the DMG as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeepHarness-${{ steps.meta.outputs.tag }}
          path: build/DeepHarness.dmg
          if-no-files-found: error

      - name: Create / update the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Re-runnable: drop any existing release for this tag (keep the tag,
          # which --target below requires).
          gh release delete "${{ steps.meta.outputs.tag }}" --yes 2>/dev/null || true
          cat > /tmp/release-notes.md <<'NOTES'
          ## Download

          - **`DeepHarness.dmg`** — open it and drag **DSH** into **Applications**.

          Builds are ad-hoc-signed for Apple Silicon (arm64), macOS 14+. Gatekeeper
          will prompt on first launch — right-click the app and choose **Open**, or run:

          ```bash
          xattr -d com.apple.quarantine /Applications/DSH.app
          ```
          NOTES
          gh release create "${{ steps.meta.outputs.tag }}" \
            --title "${{ steps.meta.outputs.title }}" \
            --target "${{ github.ref_name }}" \
            --notes-file /tmp/release-notes.md \
            build/DeepHarness.dmg
